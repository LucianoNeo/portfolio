services:
  raids:
    build:
      context: .
      dockerfile: raid-booking/Dockerfile
    ports:
      - "127.0.0.1:5082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Data Source=/data/raids.db;Default Timeout=30
    volumes:
      - raids-data:/data
  inbox:
    build:
      context: .
      dockerfile: webhook-inbox/Dockerfile
    ports:
      - "127.0.0.1:5083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Data Source=/data/inbox.db;Default Timeout=30
    volumes:
      - inbox-data:/data
volumes:
  raids-data:
  inbox-data:
