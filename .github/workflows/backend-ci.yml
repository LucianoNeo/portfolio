name: Back-end and website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore projects/BackendLabs.slnx
      - run: dotnet test projects/BackendLabs.slnx --no-restore --configuration Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: projects/**/TestResults/*.trx
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate website JavaScript
        run: |
          if [ -f dist/script.js ]; then
            node --check dist/script.js
          else
            node --check script.js
          fi
